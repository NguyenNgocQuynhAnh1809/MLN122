<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MLN122 – Quiz 501 câu</title>
<style>
:root{color-scheme:light;--red:#d00000;--ink:#111;--mut:#666;--line:#d9d9d9;--bg:#f5f6f8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans","Be Vietnam Pro",sans-serif;line-height:1.5}
.wrap{max-width:860px;margin:0 auto;padding:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px}
h1{font-size:22px;margin:4px 0 10px}
button{font:inherit;cursor:pointer;border:1px solid #bbb;background:#fff;color:var(--ink);padding:8px 14px;border-radius:8px}
button:hover:not(:disabled){background:#eee}button:disabled{opacity:.45;cursor:not-allowed}
button.pri{background:#111;color:#fff;border-color:#111}button.pri:hover:not(:disabled){background:#333}
button.red{border-color:var(--red);color:var(--red)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.sp{flex:1}
.stats{font-size:14px;color:var(--mut)}.stats b{color:var(--ink)}.stats .r{color:var(--red);font-weight:700}
#grid{display:flex;flex-wrap:wrap;gap:3px;max-height:116px;overflow:auto;margin-top:10px}
#grid i{font-style:normal;width:26px;height:22px;font-size:10px;line-height:20px;text-align:center;border:1px solid #ccc;border-radius:4px;background:#eee;color:#555;cursor:pointer}
#grid i.ok{background:#111;color:#fff;border-color:#111}#grid i.bad{background:var(--red);color:#fff;border-color:var(--red)}
#grid i.cur{outline:2px solid #2563eb;outline-offset:1px}
.qt{font-size:18px;font-weight:600;margin:0 0 12px;white-space:pre-wrap}
.qt.ok{color:#000}.qt.bad{color:var(--red)}
.opt{display:flex;gap:10px;width:100%;text-align:left;margin:0 0 8px;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff}
.opt .L{font-weight:700;min-width:22px}.opt.sel{border-color:#2563eb;background:#eef4ff}
.opt.right{border-color:#000;border-width:2px;font-weight:700;color:#000;background:#fff}
.opt.wrong{border-color:var(--red);border-width:2px;color:var(--red);background:#fff5f5}
.note{margin-top:8px;font-size:14px;color:var(--mut)}
.badge{font-size:12px;color:var(--mut)}
label.chk{display:flex;gap:8px;align-items:center;margin:8px 0;cursor:pointer}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-start;justify-content:center;padding:14px;overflow:auto;z-index:9}
.modal.on{display:flex}.mbox{background:#fff;border-radius:12px;max-width:860px;width:100%;padding:16px}
.wi{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0;display:flex;gap:10px;align-items:flex-start}
.wi input{margin-top:6px;width:18px;height:18px;flex:none}
.wi .t{color:var(--red);font-weight:600}.wi .a{color:#000;font-weight:700;font-size:14px}.wi .c{color:var(--red);font-size:14px}
.foot{position:sticky;bottom:0;background:#fff;padding-top:10px;border-top:1px solid var(--line);margin-top:10px}
.hide{display:none!important}
</style>
</head>
<body>
<div class="wrap">

<div id="home" class="card">
  <h1>MLN122 – Quiz <span id="hN"></span> câu</h1>
  <div class="stats" id="hInfo"></div>
  <label class="chk"><input type="checkbox" id="dd" checked> Lọc câu trùng lặp (cùng nội dung câu hỏi, các phương án và đáp án đúng)</label>
  <label class="chk"><input type="checkbox" id="sh" checked> Xáo trộn thứ tự tất cả câu hỏi</label>
  <p class="badge" id="dupInfo"></p>
  <button class="pri" id="start">Bắt đầu làm quiz</button>
</div>

<div id="quiz" class="hide">
  <div class="card">
    <div class="row">
      <b id="title"></b><span class="sp"></span>
      <button id="back" class="hide">↩ Về quiz chính</button>
      <button id="shufRest" title="Xáo trộn các câu chưa làm">🔀 Xáo trộn câu chưa làm</button>
      <button id="wrongBtn" class="red">Xem câu sai (0)</button>
      <button id="homeBtn">Trang chủ</button>
    </div>
    <div class="stats" id="stats" style="margin-top:8px"></div>
    <div id="grid"></div>
  </div>
  <div class="card">
    <div class="badge" id="qmeta"></div>
    <p class="qt" id="qt"></p>
    <div id="opts"></div>
    <div class="note" id="note"></div>
    <div class="row" style="margin-top:12px">
      <button id="prev">← Câu trước</button><span class="sp"></span>
      <button id="check" class="pri hide">Kiểm tra</button>
      <button id="next" class="pri">Câu tiếp →</button>
    </div>
  </div>
</div>

<div id="result" class="card hide">
  <h1>Kết quả</h1>
  <p id="rText"></p>
  <div class="row">
    <button id="rWrong" class="red">Xem câu sai</button>
    <button id="rBack" class="hide">↩ Về quiz chính</button>
    <button id="rReview">Xem lại bài</button>
    <button id="rHome" class="pri">Trang chủ</button>
  </div>
</div>

</div>

<div class="modal" id="modal"><div class="mbox">
  <div class="row"><b id="mTitle"></b><span class="sp"></span><button id="mClose">Đóng ✕</button></div>
  <div class="row" style="margin-top:8px">
    <button id="selAll">Chọn tất cả</button><button id="selNone">Bỏ chọn</button>
    <span class="stats" id="selCount"></span>
  </div>
  <div id="mList"></div>
  <div class="foot row">
    <button id="solo" class="pri">Học riêng các câu đã chọn</button>
    <button id="merge" class="pri">Thêm vào quiz đang làm (học chung với câu chưa làm)</button>
  </div>
</div></div>

 lột sản phẩm thặng dư chi có ở chủ nghĩa tư bản","B":"Các phương thức sản xuất trước chủ nghĩa tư bản bóc lột sản phẩm thặng dư trực tiếp","C":"Sản xuất giá trị thặng dư tuyệt đối là hình thái chung nhất của sản xuất giá trị thặng dư"},"a":["A"],"note":"","k":"các luận điểm dưới đây luận điểm nào sai||bóc lột sản phẩm thặng dư chi có ở chủ nghĩa tư bản|các phương thức sản xuất trước chủ nghĩa tư bản bóc lột sản phẩm thặng dư trực tiếp|sản xuất giá trị thặng dư tuyệt đối là hình thái chung nhất của sản xuất giá trị thặng dư||bóc lột sản phẩm thặng dư chi có ở chủ nghĩa tư bản"},{"n":190,"q":"Xây dựng nên kinh tế thị trường định hướng xã hội chủ nghĩa ở Việt Nam nhằm thực hiện mục tiêu gì?","o":{"A":"Dân giàu, nước mạnh, dân chủ, công bằng, văn minh","B":"Dân giàu, nước mạnh, công bằng, dân chủ, văn minh","C":"Dân giàu, nước mạnh, văn minh, công bằng, dân chủ","D":"Dân giàu, nước mạnh, dân chủ, văn minh, công bằng"},"a":["A"],"note":"","k":"xây dựng nên kinh tế thị trường định hướng xã hội chủ nghĩa ở việt nam nhằm thực hiện mục tiêu gì||dân giàu nước mạnh công bằng dân chủ văn minh|dân giàu nước mạnh dân chủ công bằng văn minh|dân giàu nước mạnh dân chủ văn minh công bằng|dân giàu nước mạnh văn minh công bằng dân chủ||dân giàu nước mạnh dân chủ công bằng văn minh"},{"n":191,"q":"Quan điểm nào dưới đây không phải là đặc trưng chủ yếu của quá trình công nghiệp hóa, hiện đại hóa ở nước Nam?","o":{"A":"Công nghiệp hóa, hiện đại hóa gắn liền với phát triển công nghiệp năng suất.","B":"Công nghiệp hóa, hiện đại hóa trong điều kiện kinh tế thị trường, định hướng xã hội chủ nghĩa.","C":"Công nghiệp hóa, hiện đại hóa trong bối cảnh toàn cầu hóa kinh tế quốc tế.","D":"Công nghiệp hóa, hiện đại hóa theo định hướng xã hội chủ nghĩa."},"a":["A"],"note":"","k":"quan điểm nào dưới đây không phải là đặc trưng chủ yếu của quá trình công nghiệp hóa hiện đại hóa ở nước nam||công nghiệp hóa hiện đại hóa gắn liền với phát triển công nghiệp năng suất|công nghiệp hóa hiện đại hóa theo địn ện nhiệm vụ công","C":"Tạo ra những giá trị kinh tế mới giúp tăng trưởng kinh tế và tiến bộ công bằng xã hội","D":"Tạo ra khả năng có được ai cũng có đầy đủ những phúc lợi xã hội cần thiết"},"a":["A"],"note":"","k":"theo a smith kinh tế chính trị là một ngành khoa học gắn với chính khách hay nhà lập pháp gắn với những mục tiêu nào||tạo ra khả năng có được ai cũng có đầy đủ những phúc lợi xã hội cần thiết|tạo ra khả năng có được nguồn ngân sách đầy đủ cho nhà nước để thực hiện nhiệm vụ công|tạo ra nguồn thu nhập dồi dào và sinh kế phong phú cho người dân|tạo ra những giá trị kinh tế mới giúp tăng trưởng kinh tế và tiến bộ công bằng xã hội||tạo ra nguồn thu nhập dồi dào và sinh kế phong phú cho người dân"},{"n":501,"q":"Theo giáo trình, phương pháp nghiên cứu đặc thù của kinh tế chính trị Mác - Lênin là gì?","o":{"A":"Trừu tượng hóa khoa học","B":"Quan sát thực nghiệm trong phòng thí nghiệm","C":"B. Quan sát thực nghiệm trong phòng thí nghiệm Khảo sát định lượng bằng phiếu hỏi","D":"Mô phỏng bằng mô hình toán học"},"a":["A"],"note":"","k":"theo giáo trình phương pháp nghiên cứu đặc thù của kinh tế chính trị mác lênin là gì||b quan sát thực nghiệm trong phòng thí nghiệm khảo sát định lượng bằng phiếu hỏi|mô phỏng bằng mô hình toán học|quan sát thực nghiệm trong phòng thí nghiệm|trừu tượng hóa khoa học||trừu tượng hóa khoa học"}];
const $=s=>document.querySelector(s);
const byId={};D.forEach(d=>byId[d.n]=d);
let S=null,parked=[],sel=new Set(),view='home';
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const uniq=()=>{const seen=new Set();return D.filter(d=>!seen.has(d.k)&&seen.add(d.k))};
const U=uniq(),keep=new Set(U.map(d=>d.n)),dropped=D.filter(d=>!keep.has(d.n)).map(d=>d.n);
const keysOf=d=>{const k=Object.keys(d.o);return k.length?k:['A','B','C','D']};
const same=(a,b)=>a.length===b.length&&a.every(x=>b.includes(x));
function el(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function show(v){view=v;['home','quiz','result'].forEach(i=>$('#'+i).classList.toggle('hide',i!==v))}

$('#hN').textContent=D.length;
$('#hInfo').textContent='Tổng số thẻ: '+D.length+' · Sau khi lọc trùng: '+U.length;
$('#dupInfo').textContent=dropped.length?('Các câu trùng sẽ bị lọc (giữ bản có số thứ tự nhỏ hơn): Câu '+dropped.join(', Câu ')):'Không có câu trùng lặp.';

function lastEntry(id){for(let i=S.q.length-1;i>=0;i--)if(S.q[i].id===id&&S.q[i].res)return S.q[i]}
function status(){const last={},pend=new Set();S.q.forEach(e=>{if(e.res)last[e.id]=e.res;else pend.add(e.id)});return{last,pend}}
function wrongIds(){const{last,pend}=status();return Object.keys(last).map(Number).filter(id=>last[id]==='bad'&&!pend.has(id))}
function newSession(ids,title){S={title,q:ids.map(id=>({id,res:null,ch:[]})),cur:0};show('quiz');render()}

$('#start').onclick=()=>{let l=$('#dd').checked?U:D.slice();if($('#sh').checked)l=shuffle(l);parked=[];newSession(l.map(d=>d.n),'Quiz chính')};

function render(){
  const e=S.q[S.cur],d=byId[e.id],{last}=status();
  let ok=0,bad=0;for(const k in last)last[k]==='ok'?ok++:bad++;
  const rem=S.q.filter(x=>!x.res).length;
  $('#title').textContent=S.title;
  $('#stats').innerHTML='';
  const st=$('#stats');st.append('Đúng: ');st.append(el('b',null,ok));st.append(' · Sai: ');st.append(el('b','r',bad));st.append(' · Còn lại: ');st.append(el('b',null,rem));st.append(' · Tổng lượt: '+S.q.length);
  $('#back').classList.toggle('hide',!parked.length);
  $('#wrongBtn').textContent='Xem câu sai ('+wrongIds().length+')';
  const g=$('#grid');g.innerHTML='';
  S.q.forEach((x,i)=>{const c=el('i',(x.res||'')+(i===S.cur?' cur':''),i+1);c.title='Câu '+x.id;c.onclick=()=>{S.cur=i;render()};g.append(c)});
  const cc=g.children[S.cur];if(cc)cc.scrollIntoView({block:'nearest'});
  const multi=d.a.length>1;
  $('#qmeta').textContent='Vị trí '+(S.cur+1)+'/'+S.q.length+' · Số thứ tự gốc: Câu '+d.n+(multi?' · Nhiều đáp án':'');
  const qt=$('#qt');qt.textContent='Câu '+d.n+': '+d.q;qt.className='qt '+(e.res||'');
  const ob=$('#opts');ob.innerHTML='';
  keysOf(d).forEach(L=>{
    const b=el('button','opt');b.append(el('span','L',L+'.'),el('span',null,d.o[L]||''));
    if(e.res){
      if(d.a.includes(L)){b.classList.add('right');b.append(el('span',null,' ✓'))}
      else if(e.ch.includes(L)){b.classList.add('wrong');b.append(el('span',null,' ✗'))}
      if(d.a.includes(L)&&e.ch.includes(L)&&e.res==='bad')b.classList.add('right');
    }else if(e.ch.includes(L))b.classList.add('sel');
    b.onclick=()=>pick(L);ob.append(b);
  });
  $('#note').textContent=(e.res&&d.note)?('Ghi chú trong thẻ gốc: '+d.note):'';
  $('#check').classList.toggle('hide',!(multi&&!e.res));
  $('#check').disabled=!e.ch.length;
  $('#prev').disabled=S.cur===0;
  $('#next').textContent=S.q.some(x=>!x.res)?'Câu tiếp →':'Xem kết quả';
}
function pick(L){
  const e=S.q[S.cur],d=byId[e.id];if(e.res)return;
  if(d.a.length>1){e.ch=e.ch.includes(L)?e.ch.filter(x=>x!==L):e.ch.concat(L)}
  else{e.ch=[L];e.res=same(e.ch,d.a)?'ok':'bad'}
  render();
}
$('#check').onclick=()=>{const e=S.q[S.cur];if(e.res||!e.ch.length)return;e.res=same(e.ch,byId[e.id].a)?'ok':'bad';render()};
$('#prev').onclick=()=>{if(S.cur>0){S.cur--;render()}};
function next(){
  let n=S.q.findIndex((x,i)=>i>S.cur&&!x.res);
  if(n<0)n=S.q.findIndex(x=>!x.res);
  if(n<0){showResult();return}
  S.cur=n;render();
}
$('#next').onclick=next;
$('#shufRest').onclick=()=>{
  const idx=[];S.q.forEach((x,i)=>{if(i>S.cur&&!x.res)idx.push(i)});
  const items=shuffle(idx.map(i=>S.q[i]));idx.forEach((i,k)=>S.q[i]=items[k]);render();
};
$('#homeBtn').onclick=()=>{if(confirm('Thoát về trang chủ? Tiến độ hiện tại sẽ mất.')){parked=[];show('home')}};
function goBack(){if(parked.length){S=parked.pop();show('quiz');render()}}
$('#back').onclick=goBack;$('#rBack').onclick=goBack;

function showResult(){
  const{last}=status();let ok=0,bad=0;for(const k in last)last[k]==='ok'?ok++:bad++;
  $('#rText').textContent=S.title+': đúng '+ok+', sai '+bad+' / '+(ok+bad)+' câu.';
  $('#rBack').classList.toggle('hide',!parked.length);
  $('#rWrong').textContent='Xem câu sai ('+wrongIds().length+')';
  show('result');
}
$('#rWrong').onclick=openWrong;$('#rHome').onclick=()=>{parked=[];show('home')};
$('#rReview').onclick=()=>{S.cur=0;show('quiz');render()};
$('#wrongBtn').onclick=openWrong;

function openWrong(){
  const ids=wrongIds();sel=new Set();
  $('#mTitle').textContent='Các câu làm sai ('+ids.length+')';
  const list=$('#mList');list.innerHTML='';
  if(!ids.length)list.append(el('p',null,'Chưa có câu sai nào.'));
  ids.forEach(id=>{
    const d=byId[id],e=lastEntry(id),w=el('label','wi');
    const cb=document.createElement('input');cb.type='checkbox';cb.dataset.id=id;
    cb.onchange=()=>{cb.checked?sel.add(id):sel.delete(id);upd()};
    const box=el('div');
    box.append(el('div','t','Câu '+d.n+': '+d.q));
    const pk=e.ch.map(L=>L+'. '+(d.o[L]||'')).join(' | ');
    box.append(el('div','c','Bạn chọn: '+pk));
    box.append(el('div','a','Đáp án đúng: '+d.a.map(L=>L+'. '+(d.o[L]||'')).join(' | ')));
    if(d.note)box.append(el('div','badge','Ghi chú trong thẻ gốc: '+d.note));
    w.append(cb,box);list.append(w);
  });
  upd();$('#modal').classList.add('on');
}
function upd(){
  $('#selCount').textContent='Đã chọn '+sel.size+' câu';
  $('#solo').disabled=$('#merge').disabled=!sel.size;
  document.querySelectorAll('#mList input').forEach(c=>c.checked=sel.has(+c.dataset.id));
}
$('#selAll').onclick=()=>{wrongIds().forEach(i=>sel.add(i));upd()};
$('#selNone').onclick=()=>{sel.clear();upd()};
$('#mClose').onclick=()=>$('#modal').classList.remove('on');
$('#solo').onclick=()=>{
  const ids=[...sel];$('#modal').classList.remove('on');
  parked.push(S);newSession(shuffle(ids),'Ôn riêng câu sai ('+ids.length+')');
};
$('#merge').onclick=()=>{
  const ids=shuffle([...sel]);$('#modal').classList.remove('on');
  const base=S.cur+1;let first=-1;
  ids.forEach(id=>{
    const pos=base+Math.floor(Math.random()*(S.q.length-base+1));
    S.q.splice(pos,0,{id,res:null,ch:[]});
  });
  show('quiz');
  if(S.q[S.cur].res){const n=S.q.findIndex((x,i)=>i>S.cur&&!x.res);if(n>=0)S.cur=n}
  render();
};

document.addEventListener('keydown',ev=>{
  if(view!=='quiz'||$('#modal').classList.contains('on')||ev.ctrlKey||ev.metaKey||ev.altKey)return;
  const e=S.q[S.cur],d=byId[e.id],k=ev.key.toUpperCase();
  if(keysOf(d).includes(k)&&k.length===1){pick(k)}
  else if(ev.key==='Enter'){e.res?next():$('#check').click()}
  else if(ev.key==='ArrowRight')next();
  else if(ev.key==='ArrowLeft')$('#prev').click();
});
</script>
</body>
</html>
